        run: python3 -m pip install --user pyyaml==6.0.3
      - name: Run the gate, collector, coverage, workflow and inventory tests
        run: python3 -B -m unittest discover -s eng/tests -p 'test_*.py'
      - name: Validate retained APIs and the deprecation lifecycle ledger
        shell: pwsh
        run: ./eng/verify-deprecations.ps1 -Output artifacts/deprecation-validation.json

  # Aggregates the evidence of every lane that this workflow defines. The verdict is SCOPED (CI-defined lanes only):
  # current-servicing lanes need the isolated local toolchains, so a CI pass is never the whole candidate verdict. The
  # full verdict is `verify-candidate.ps1 -Mode Aggregate` over all evidence (docs/governance/required-checks.md).
  candidate-gate:
    name: candidate gate
    if: ${{ !cancelled() }}
    needs:
      - candidate-pack
      - eng-tooling-tests
      - build
      - package-compatibility
      - redis-package-compatibility
      - projection-postgresql
      - caching-redis
      - ef-transactions
      - ef10-compatibility
      - http-integration
      - native-aot
      - property-counts
      - coverage
      - warning-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed
      - uses: actions/download-artifact@v4
        with:
          pattern: lane-*
          merge-multiple: true
          path: artifacts/evidence
      - name: Require all dependency jobs to succeed
        shell: pwsh
        env:
          MERIDIAN_CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          $ErrorActionPreference = 'Stop'
          $policy = Get-Content -Raw eng/required-checks.json | ConvertFrom-Json
          $expected = @(@($policy.lanes | Where-Object { $_.ci -and $_.ci.workflow -eq 'ci.yml' } | ForEach-Object { $_.ci.job }) +
              @($policy.infrastructureChecks | Where-Object { $_.workflow -eq 'ci.yml' -and $_.job -ne 'candidate-gate' } | ForEach-Object job) | Sort-Object -Unique)
          $actual = $env:MERIDIAN_CI_NEEDS | ConvertFrom-Json -AsHashtable
          if ($actual -isnot [Collections.IDictionary] -or $expected.Count -eq 0 -or $actual.Count -ne $expected.Count -or
              @(Compare-Object @($actual.Keys | Sort-Object) $expected).Count -ne 0) { throw 'Required dependency job identities are missing or unexpected.' }
          foreach ($name in $expected) {
              if ($actual[$name] -isnot [Collections.IDictionary] -or $actual[$name]['result'] -isnot [string] -or $actual[$name]['result'] -cne 'success') {
                  throw "Required dependency $name did not succeed. Earlier artifact evidence cannot replace this attempt."
              }
          }
      - name: Evaluate every CI-defined lane against the policy and the candidate hashes
        id: evaluate-candidate
        shell: pwsh
        run: ./eng/verify-candidate.ps1 -Mode Aggregate -CiLanesOnly -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -PackageManifestSha256 '${{ needs.candidate-pack.outputs.manifestSha256 }}' -SourceCommit '${{ github.sha }}' -Context github-actions -RunId '${{ github.run_id }}'
      - name: Bind the summary to this attempt and retain dependency failures
        id: finalize-summary
        if: always()
        shell: pwsh
        env:
          EVALUATION_OUTCOME: ${{ steps.evaluate-candidate.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = 'artifacts/evidence'
          $null = New-Item -ItemType Directory -Force $directory
          $path = Join-Path $directory 'summary.json'
          $summary = $null
          if (Test-Path -LiteralPath $path) {
            try { $summary = Get-Content -Raw -LiteralPath $path | ConvertFrom-Json -AsHashtable } catch { $summary = $null }
          }
          if ($summary -isnot [Collections.IDictionary]) {
            $summary = @{ schema='meridian-candidate-summary/2'; overall='FAIL'; exitCode=1; wholeCandidate=$false;
              releaseEligible=$false; failures=@('This attempt produced no valid candidate summary.'); lanes=@() }
          }
          if ($env:EVALUATION_OUTCOME -cne 'success') {
            $summary.overall = 'FAIL'; $summary.exitCode = 1; $summary.releaseEligible = $false
            $summary.failures = @($summary.failures) + @('Candidate evaluation did not succeed in this attempt; earlier artifacts cannot replace it.')
          }
          $summary.ciAttempt = @{runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT}
          $summary | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath $path
          $markdown = Join-Path $directory 'summary.md'
          if ($summary.overall -eq 'FAIL' -or -not (Test-Path -LiteralPath $markdown)) {
            @("# Candidate summary: $($summary.overall)", '', "Run $env:GITHUB_RUN_ID, attempt $env:GITHUB_RUN_ATTEMPT",
              '', 'See summary.json for the retained lane facts and failures.') + @($summary.failures | ForEach-Object { "* $_" }) |
              Set-Content -LiteralPath $markdown
          }
          if ($summary.overall -eq 'FAIL') { exit 1 }
      - name: Retain immutable attempt evidence
        id: snapshot-122
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-candidate-summary-attempt-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            artifacts/evidence/summary.json
            artifacts/evidence/summary.md
          retention-days: 30

      - name: Upload candidate summary
        if: always() && steps.snapshot-122.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-summary
          if-no-files-found: error
          path: |
            artifacts/evidence/summary.json
            artifacts/evidence/summary.md
          overwrite: true
          retention-days: 30

  preview:
    name: preview samples (net11.0, optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      MeridianIncludeNet11Samples: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup preview SDK
        uses: actions/setup-dotnet@v6
        with:
          skip-lts-prepass: true
          dotnet-version: 11.0.x

      # Select preview only in this job's checkout. The committed global.json
      # continues to reject previews in every stable lane.
      - name: Select preview SDK locally
        shell: bash
        run: |
          sdk="$(dotnet --list-sdks | awk '$1 ~ /^11\./ {print $1}' | sort -V | tail -1)"
          test -n "$sdk"
          printf '{"sdk":{"version":"%s","rollForward":"latestFeature","allowPrerelease":true}}\n' "$sdk" > global.json
          dotnet --info

      - name: Build preview samples
        run: dotnet build Meridian.sln -c Release
