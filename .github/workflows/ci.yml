  # Required infrastructure check (eng/required-checks.json infrastructureChecks). The suite builds and packs fixture
  # projects, so it uses the same exact SDKs; the full discovery takes about 25 minutes on a developer machine.
  eng-tooling-tests:
    name: eng tooling tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
