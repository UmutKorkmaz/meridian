name: CI

# Security review: this workflow uses only trusted inputs (matrix.os,
# github.workflow, github.ref) in ${{ }} expressions. No attacker-controlled
# github.event.* fields flow into `run:` blocks. Safe.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # keep full history for release/debug parity checks

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Meridian.sln

      - name: Build
        run: dotnet build Meridian.sln -c Release --no-restore

      - name: Test
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: >
          dotnet test Meridian.sln
          -c Release --no-build
          --filter "Provider!=PostgreSQL&Provider!=Redis"
          --logger "trx;LogFilePrefix=$MATRIX_OS"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory ./test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results/**/*
          retention-days: 7

      - name: Pack (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Meridian.Mapping/Meridian.Mapping.csproj \
            -c Release --no-build -o ./artifacts
          dotnet pack src/Meridian.Mediator/Meridian.Mediator.csproj \
            -c Release --no-build -o ./artifacts

      - name: Inspect package contents
        if: matrix.os == 'ubuntu-latest'
        run: |
          for pkg in ./artifacts/*.nupkg; do
            echo "=== $pkg ==="
            unzip -l "$pkg" | head -30
          done

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.*nupkg
          retention-days: 14

  projection-postgresql:
    name: PostgreSQL projections (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: meridian_test
          POSTGRES_PASSWORD: meridian_test_only
          POSTGRES_DB: meridian_projection_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U meridian_test -d meridian_projection_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
      MERIDIAN_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=meridian_projection_test;Username=meridian_test;Password=meridian_test_only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Execute required PostgreSQL contracts
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet test tests/Meridian.Mapping.EntityFramework.Tests/Meridian.Mapping.EntityFramework.Tests.csproj
          -c Release -f "$MATRIX_FRAMEWORK" --filter "Provider=PostgreSQL"
          --logger "trx;LogFileName=postgresql.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/projection-postgresql
      - name: Retain SQL, provider versions and command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-postgresql-${{ matrix.framework }}
          path: artifacts/projection-postgresql/**
          retention-days: 14

  caching-redis:
    name: Distributed cache Redis (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
      MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports[6379] }},abortConnect=true,connectTimeout=5000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Execute required isolated Redis cache contracts
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet test tests/Meridian.Mediator.Caching.Tests/Meridian.Mediator.Caching.Tests.csproj
          -c Release -f "$MATRIX_FRAMEWORK" --filter "Provider=Redis"
          --logger "trx;LogFileName=redis.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/caching-redis
      - name: Retain executed provider and binary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caching-redis-${{ matrix.framework }}
          path: artifacts/caching-redis/**
          retention-days: 14

  package-compatibility:
    name: package consumers (${{ matrix.os }}, SDK ${{ matrix.host.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        host:
          - { framework: net8.0, sdk: 8.0.421 }
          - { framework: net9.0, sdk: 9.0.318 }
          - { framework: net10.0, sdk: 10.0.300 }
    env:
      CANDIDATE_VERSION: 2.1.4-a4.${{ github.run_id }}.${{ github.run_attempt }}
      DOTNET_ROLL_FORWARD: LatestPatch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.300
            ${{ matrix.host.sdk }}
      - name: Pack and validate stable API baseline
        shell: pwsh
        run: ./eng/pack-packages.ps1 -OutputDirectory artifacts/packages -CandidateVersion $env:CANDIDATE_VERSION
      - name: Run isolated native compiler consumers
        shell: pwsh
        run: ./eng/verify-packages.ps1 -Feed artifacts/packages -CandidateVersion $env:CANDIDATE_VERSION -Framework '${{ matrix.host.framework }}' -SdkVersion '${{ matrix.host.sdk }}'
      - name: Retain package hashes and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.host.framework }}
          path: |
            artifacts/packages/**
            artifacts/package-consumers/**
          retention-days: 14
