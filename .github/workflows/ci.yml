name: CI

# Security review: this workflow uses only trusted inputs (matrix.os,
# github.workflow, github.ref) in ${{ }} expressions. No attacker-controlled
# github.event.* fields flow into `run:` blocks. Safe.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # keep full history for release/debug parity checks

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Meridian.sln

      - name: Build
        run: dotnet build Meridian.sln -c Release --no-restore

      - name: Test
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
        run: |
          # The HTTP sample test project has a dedicated net10-only provider lane.
          for project in tests/*/*.csproj; do
            [[ "$project" == tests/Meridian.AspNetCore.Tests/* ]] && continue
            dotnet test "$project" -c Release --no-build \
              --filter "Provider!=PostgreSQL&Provider!=Redis" \
              --logger "trx;LogFilePrefix=$MATRIX_OS" \
              --logger "console;verbosity=normal" --collect:"XPlat Code Coverage" \
              --results-directory ./test-results
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: ./test-results/**/*
          retention-days: 7

      - name: Pack (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet pack src/Meridian.Mapping/Meridian.Mapping.csproj \
            -c Release --no-build -o ./artifacts
          dotnet pack src/Meridian.Mediator/Meridian.Mediator.csproj \
            -c Release --no-build -o ./artifacts

      - name: Inspect package contents
        if: matrix.os == 'ubuntu-latest'
        run: |
          for pkg in ./artifacts/*.nupkg; do
            echo "=== $pkg ==="
            unzip -l "$pkg" | head -30
          done

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.*nupkg
          retention-days: 14

  projection-postgresql:
    name: PostgreSQL projections (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: meridian_test
          POSTGRES_PASSWORD: meridian_test_only
          POSTGRES_DB: meridian_projection_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U meridian_test -d meridian_projection_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
      MERIDIAN_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=meridian_projection_test;Username=meridian_test;Password=meridian_test_only
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Execute required PostgreSQL contracts
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet test tests/Meridian.Mapping.EntityFramework.Tests/Meridian.Mapping.EntityFramework.Tests.csproj
          -c Release -f "$MATRIX_FRAMEWORK" --filter "Provider=PostgreSQL"
          --logger "trx;LogFileName=postgresql.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/projection-postgresql
      - name: Retain SQL, provider versions and command evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: projection-postgresql-${{ matrix.framework }}
          path: artifacts/projection-postgresql/**
          retention-days: 14

  caching-redis:
    name: Distributed cache Redis (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
      MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports[6379] }},abortConnect=true,connectTimeout=5000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Execute required isolated Redis cache contracts
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet test tests/Meridian.Mediator.Caching.Tests/Meridian.Mediator.Caching.Tests.csproj
          -c Release -f "$MATRIX_FRAMEWORK" --filter "Provider=Redis"
          --logger "trx;LogFileName=redis.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/caching-redis
      - name: Execute required owned Redis leases and process restart proof
        env:
          MATRIX_FRAMEWORK: ${{ matrix.framework }}
        run: >-
          dotnet test tests/Meridian.Mediator.Redis.Tests/Meridian.Mediator.Redis.Tests.csproj
          -c Release -f "$MATRIX_FRAMEWORK" --filter "Provider=Redis"
          --logger "trx;LogFileName=leased-redis.trx" --logger "console;verbosity=normal"
          --results-directory artifacts/caching-redis
      - name: Retain executed provider and binary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caching-redis-${{ matrix.framework }}
          path: artifacts/caching-redis/**
          retention-days: 14

  package-compatibility:
    name: package consumers (${{ matrix.os }}, SDK ${{ matrix.host.sdk }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        host:
          - { framework: net8.0, sdk: 8.0.421 }
          - { framework: net9.0, sdk: 9.0.318 }
          - { framework: net10.0, sdk: 10.0.300 }
    env:
      CANDIDATE_VERSION: 2.1.4-a4.${{ github.run_id }}.${{ github.run_attempt }}
      DOTNET_ROLL_FORWARD: LatestPatch
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.300
            ${{ matrix.host.sdk }}
      - name: Pack and validate stable API baseline
        shell: pwsh
        run: ./eng/pack-packages.ps1 -OutputDirectory artifacts/packages -CandidateVersion $env:CANDIDATE_VERSION
      - name: Run isolated native compiler consumers
        shell: pwsh
        run: ./eng/verify-packages.ps1 -Feed artifacts/packages -CandidateVersion $env:CANDIDATE_VERSION -Framework '${{ matrix.host.framework }}' -SdkVersion '${{ matrix.host.sdk }}' -ExcludeConsumerIds Meridian.RedisIdempotencyConsumer
      - name: Retain package hashes and compiler evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.host.framework }}
          path: |
            artifacts/packages/**
            artifacts/package-consumers/**
          retention-days: 14

  redis-package-compatibility:
    name: Required Redis all-package consumers (${{ matrix.host.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - { framework: net8.0, sdk: 8.0.421 }
          - { framework: net9.0, sdk: 9.0.318 }
          - { framework: net10.0, sdk: 10.0.300 }
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANDIDATE_VERSION: 2.1.4-c4.${{ github.run_id }}.${{ github.run_attempt }}
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
      MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports[6379] }},abortConnect=true,connectTimeout=5000
      MERIDIAN_TEST_REDIS_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.300
            ${{ matrix.host.sdk }}
      - name: Pack every inventory archive
        shell: pwsh
        run: ./eng/pack-packages.ps1 -OutputDirectory artifacts/redis-packages -CandidateVersion $env:CANDIDATE_VERSION
      - name: Require every selected compiler consumer with real Redis
        shell: pwsh
        run: ./eng/verify-packages.ps1 -Feed artifacts/redis-packages -CandidateVersion $env:CANDIDATE_VERSION -Framework '${{ matrix.host.framework }}' -SdkVersion '${{ matrix.host.sdk }}' -OutputDirectory artifacts/redis-package-consumers
      - name: Retain all-package required provider evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redis-package-compatibility-${{ matrix.host.framework }}
          path: |
            artifacts/redis-packages/**
            artifacts/redis-package-consumers/**
          retention-days: 14

  ef-transactions:
    name: EF transactions (${{ matrix.framework }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: meridian_test_only
          POSTGRES_DB: meridian_ef_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian_ef_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379/tcp']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
      MERIDIAN_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=meridian_ef_test;Username=postgres;Password=meridian_test_only
      MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports[6379] }}
      MATRIX_FRAMEWORK: ${{ matrix.framework }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.421
            9.0.318
            10.0.300
      - name: Execute required EF8 transactions and real provider contracts
        run: >-
          dotnet test tests/Meridian.Mediator.EntityFrameworkCore.Tests/Meridian.Mediator.EntityFrameworkCore.Tests.csproj
          -c Release -f "$MATRIX_FRAMEWORK" --logger "trx;LogFileName=ef8.trx"
          --results-directory artifacts/ef-transactions
      - name: Pack all packages and execute isolated EF10 compatibility
        if: matrix.framework == 'net10.0'
        shell: pwsh
        run: |
          ./eng/pack-packages.ps1 -CandidateVersion 2.1.4-ci.ef -OutputDirectory artifacts/ef-feed
          ./eng/verify-packages.ps1 -CandidateVersion 2.1.4-ci.ef -Feed artifacts/ef-feed -OutputDirectory artifacts/ef-consumers
          ./eng/test-ef10-compatibility.ps1 -CandidateVersion 2.1.4-ci.ef -Feed artifacts/ef-feed
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ef-transactions-${{ matrix.framework }}
          path: |
            artifacts/ef-transactions/**
            artifacts/ef10-compatibility/**
            artifacts/ef-consumers/**

  http-integration:
    name: HTTP orders, real Redis and SQLite (net10.0)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379/tcp']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports[6379] }}
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300
      - name: HTTP composition and real socket lifecycle
        run: dotnet test tests/Meridian.AspNetCore.Tests -c Release --logger "trx;LogFileName=http.trx" --results-directory artifacts/http-results
      - name: Preserve console samples and run bounded HTTP process smoke
        shell: pwsh
        run: ./eng/run-samples.ps1 -Framework net10.0 -IncludeHttp
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: http-integration-net10
          path: |
            artifacts/http-results/**
            artifacts/C6/socket/**
            artifacts/sample-results/**

  native-aot-pack:
    name: native AOT candidate packages
    runs-on: ubuntu-latest
    env:
      CANDIDATE_VERSION: 2.1.4-d4.${{ github.run_id }}.${{ github.run_attempt }}
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.300
      # One packaging job from one frozen source snapshot. Both native lanes download and inspect this exact feed;
      # independent repacks would be different archives and are never merged into one exact-artifact claim.
      - name: Pack every inventory archive once
        shell: pwsh
        run: ./eng/pack-packages.ps1 -OutputDirectory artifacts/native-feed -CandidateVersion $env:CANDIDATE_VERSION
      - name: Retain the immutable candidate feed
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-feed
          path: artifacts/native-feed/**
          retention-days: 14
          if-no-files-found: error

  # Publishes the packaged consumer with PublishAot/trimming and EXECUTES the native binary on a matching real runner
  # (linux-x64 on an x64 runner, osx-arm64 on an Apple-silicon runner). The runner refuses emulated, translated or
  # mismatched hosts, so cross-publication can never pass. Existing runtime, sample, package and provider jobs are unchanged.
  native-aot:
    name: native AOT ${{ matrix.rid }} (${{ matrix.host.framework }})
    needs: native-aot-pack
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, osx-arm64]
        host:
          - { framework: net8.0, sdk: 8.0.421 }
          - { framework: net9.0, sdk: 9.0.318 }
          - { framework: net10.0, sdk: 10.0.300 }
        include:
          - { rid: linux-x64, runner: ubuntu-24.04 }
          - { rid: osx-arm64, runner: macos-14 }
    env:
      CANDIDATE_VERSION: 2.1.4-d4.${{ github.run_id }}.${{ github.run_attempt }}
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.300
            ${{ matrix.host.sdk }}
      - name: Install Linux native toolchain
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev
      - name: Record host and native toolchain
        shell: bash
        run: |
          uname -a
          clang --version
          if [ "$RUNNER_OS" = "macOS" ]; then xcode-select -p; sw_vers; fi
      - uses: actions/download-artifact@v4
        with:
          name: native-aot-feed
          path: artifacts/native-feed
      - name: Publish and execute the combined mediator and mapping consumer
        shell: pwsh
        run: ./eng/run-aot-smoke.ps1 -Combined -Feed artifacts/native-feed -CandidateVersion $env:CANDIDATE_VERSION -Framework '${{ matrix.host.framework }}' -SdkVersion '${{ matrix.host.sdk }}' -Rid '${{ matrix.rid }}' -OutputDirectory artifacts/native-aot
      - name: Publish and execute the unchanged mapping-only consumer
        shell: pwsh
        run: ./eng/run-aot-smoke.ps1 -MappingOnly -Feed artifacts/native-feed -CandidateVersion $env:CANDIDATE_VERSION -Framework '${{ matrix.host.framework }}' -SdkVersion '${{ matrix.host.sdk }}' -RuntimeIdentifier '${{ matrix.rid }}' -OutputDirectory artifacts/native-aot-mapping
      - name: Run the readable sample with the same assertions (managed)
        run: dotnet run --project samples/Meridian.NativeAot/Meridian.NativeAot.csproj -c Release -f '${{ matrix.host.framework }}'
      - name: Retain native publish, warning, case and binary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-aot-${{ matrix.rid }}-${{ matrix.host.framework }}
          path: |
            artifacts/native-aot/**
            artifacts/native-aot-mapping/**
            !artifacts/native-aot/**/packages/**
            !artifacts/native-aot-mapping/**/packages/**
          retention-days: 14
