name: CI

# Security review: this workflow uses only trusted inputs (matrix values, github.run_id, github.sha, needs outputs
# derived from github.run_id) in ${{ }} expressions. No attacker-controlled github.event.* fields flow into `run:`
# blocks. Every job runs with the read-only token below.
#
# Lane model (see docs/governance/required-checks.md and eng/required-checks.json, the single source of truth):
#   * candidate-pack packs the candidate ONCE; every lane that consumes packages downloads that exact feed, so every
#     lane is bound to the same package hashes.
#   * Runtime lanes (`build + test`) execute the suites and samples on each OS for each runtime family. SDK-host
#     consumer lanes (`package consumers`, `Required Redis ...`) compile consumers with each pinned SDK on each OS.
#     They are separate jobs because they prove different things (runtime behavior vs compiler/SDK compatibility).
#   * Provider lanes use service containers pinned by digest; a missing service fails the lane. Native AOT lanes publish
#     and EXECUTE a native binary on a matching real runner.
#   * Each lane runs `eng/verify-candidate.ps1 -Mode Run -Lane <id>`, which writes lane evidence (its raw TRX files,
#     receipts and logs plus a summary); `candidate gate` re-derives every CI-defined lane from that raw evidence.
#     Exact SDKs (8.0.421 / 9.0.318 / 10.0.300) mirror eng/packages.json compilerHosts and are installed into a private
#     DOTNET_INSTALL_DIR, so the build SDK is exactly 10.0.300 and each family has exactly its pinned runtime patch (the
#     gate checks the retained toolchain receipt). No preview SDK is used by a required job.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-pack:
    name: candidate packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The candidate version is derived exactly once, here, and handed to every lane as a job output. "Re-run failed jobs"
    # keeps this job's outputs and feed (it is not re-run); "Re-run all jobs" derives a new version from the new
    # run_attempt and retains a separate immutable feed artifact, so every lane of one attempt uses one feed. The package
    # manifest hash is exported as an independent anchor that the candidate gate compares with the downloaded feed.
    outputs:
      candidate: ${{ steps.version.outputs.candidate }}
      feedArtifact: candidate-feed-${{ steps.version.outputs.candidate }}
      manifestSha256: ${{ steps.anchor.outputs.manifestSha256 }}
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: 10.0.300
      - name: Derive the candidate version once
        id: version
        shell: bash
        run: echo "candidate=2.1.4-ci.${{ github.run_id }}.${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Pack every inventory archive once
        shell: pwsh
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.candidate }}
        run: ./eng/pack-packages.ps1 -OutputDirectory artifacts/candidate-feed -CandidateVersion $env:CANDIDATE_VERSION
      - name: Export the package manifest hash
        id: anchor
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.version.outputs.candidate }}
        run: echo "manifestSha256=$(sha256sum "artifacts/candidate-feed/package-manifest.${CANDIDATE_VERSION}.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Retain the immutable candidate feed
        uses: actions/upload-artifact@v4
        with:
          name: candidate-feed-${{ steps.version.outputs.candidate }}
          path: artifacts/candidate-feed/**
          retention-days: 14
          if-no-files-found: error

  build:
    name: build + test (${{ matrix.os }}, ${{ matrix.framework }})
    needs: candidate-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: [net8.0, net9.0, net10.0]
        include:
          - { os: ubuntu-latest, hostos: linux }
          - { os: windows-latest, hostos: win }
          - { os: macos-latest, hostos: osx }
    env:
      MeridianIncludeNet11Samples: 'false'
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # keep full history for release/debug parity checks

      - name: Setup .NET SDKs (exact pinned patches; each installs its runtime family)
        uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: |
            8.0.421
            9.0.318
            10.0.300

      - name: Verify the exact build SDK and required runtimes
        shell: bash
        run: |
          sdk="$(dotnet --version)"
          [[ "$sdk" == "10.0.300" ]]
          runtimes="$(dotnet --list-runtimes)"
          for family in 8 9 10; do
            echo "$runtimes" | grep -E "^Microsoft.NETCore.App $family\." > /dev/null
          done
          dotnet --info

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed

      - name: Execute every suite and sample for this OS and runtime family, collect lane evidence
        shell: pwsh
        run: ./eng/verify-candidate.ps1 -Mode Run -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -Lane 'runtime-tests/${{ matrix.hostos }}/${{ matrix.framework }}' -Context github-actions -RunId '${{ github.run_id }}'

      - name: Retain immutable attempt evidence
        id: snapshot-12
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-lane-runtime-${{ matrix.hostos }}-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          retention-days: 14

      - name: Upload lane evidence
        if: always() && steps.snapshot-12.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lane-runtime-${{ matrix.hostos }}-${{ matrix.framework }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          overwrite: true
          retention-days: 14

      - name: Retain immutable attempt evidence
        id: snapshot-14
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-work-runtime-${{ matrix.hostos }}-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/evidence/work/**/*.log
            artifacts/evidence/work/**/*.trx
            artifacts/evidence/summary.*
          retention-days: 7

      - name: Upload logs
        if: always() && steps.snapshot-14.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: work-runtime-${{ matrix.hostos }}-${{ matrix.framework }}
          path: |
            artifacts/evidence/work/**/*.log
            artifacts/evidence/work/**/*.trx
            artifacts/evidence/summary.*
          overwrite: true
          retention-days: 7

  package-compatibility:
    name: package consumers (${{ matrix.os }}, SDK ${{ matrix.host.sdk }})
    needs: candidate-pack
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        host:
          - { framework: net8.0, sdk: 8.0.421 }
          - { framework: net9.0, sdk: 9.0.318 }
          - { framework: net10.0, sdk: 10.0.300 }
        include:
          - { os: ubuntu-latest, hostos: linux }
          - { os: windows-latest, hostos: win }
          - { os: macos-latest, hostos: osx }
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: |
            10.0.300
            ${{ matrix.host.sdk }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed
      - name: Run isolated native compiler consumers (backend-free partial selection)
        shell: pwsh
        run: ./eng/verify-candidate.ps1 -Mode Run -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -Lane 'package-consumers/${{ matrix.hostos }}/${{ matrix.host.framework }}' -Context github-actions -RunId '${{ github.run_id }}'
      - name: Retain immutable attempt evidence
        id: snapshot-20
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-lane-consumers-${{ matrix.hostos }}-${{ matrix.host.framework }}-attempt-${{ github.run_attempt }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          retention-days: 14
      - name: Upload lane evidence
        if: always() && steps.snapshot-20.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lane-consumers-${{ matrix.hostos }}-${{ matrix.host.framework }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          overwrite: true
          retention-days: 14
      - name: Retain immutable attempt evidence
        id: snapshot-22
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-compatibility-${{ matrix.os }}-${{ matrix.host.framework }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/evidence/work/**/consumer-*.json
            artifacts/evidence/work/**/sbom-inventory.json
            artifacts/evidence/work/**/*.log
          retention-days: 14

      - name: Retain compiler evidence
        if: always() && steps.snapshot-22.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-${{ matrix.os }}-${{ matrix.host.framework }}
          path: |
            artifacts/evidence/work/**/consumer-*.json
            artifacts/evidence/work/**/sbom-inventory.json
            artifacts/evidence/work/**/*.log
          overwrite: true
          retention-days: 14

  redis-package-compatibility:
    name: Required Redis all-package consumers (${{ matrix.host.framework }})
    needs: candidate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        host:
          - { framework: net8.0, sdk: 8.0.421 }
          - { framework: net9.0, sdk: 9.0.318 }
          - { framework: net10.0, sdk: 10.0.300 }
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: meridian_test_only
          POSTGRES_DB: meridian_ef_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian_ef_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: |
            10.0.300
            ${{ matrix.host.sdk }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed
      - name: Require every compiler consumer with real PostgreSQL and Redis
        shell: pwsh
        env:
          MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports['6379'] }},abortConnect=true,connectTimeout=5000
          MERIDIAN_TEST_REDIS_REQUIRED: '1'
          MERIDIAN_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=meridian_ef_test;Username=postgres;Password=meridian_test_only
        run: ./eng/verify-candidate.ps1 -Mode Run -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -Lane 'package-consumers-redis/${{ matrix.host.framework }}' -Context github-actions -RunId '${{ github.run_id }}'
      - name: Retain immutable attempt evidence
        id: snapshot-28
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-lane-consumers-redis-${{ matrix.host.framework }}-attempt-${{ github.run_attempt }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          retention-days: 14
      - name: Upload lane evidence
        if: always() && steps.snapshot-28.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lane-consumers-redis-${{ matrix.host.framework }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          overwrite: true
          retention-days: 14
      - name: Retain immutable attempt evidence
        id: snapshot-30
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-redis-package-compatibility-${{ matrix.host.framework }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/evidence/work/**/consumer-*.json
            artifacts/evidence/work/**/*.log
          retention-days: 14

      - name: Retain all-package required provider evidence
        if: always() && steps.snapshot-30.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: redis-package-compatibility-${{ matrix.host.framework }}
          path: |
            artifacts/evidence/work/**/consumer-*.json
            artifacts/evidence/work/**/*.log
          overwrite: true
          retention-days: 14

  projection-postgresql:
    name: PostgreSQL projections (${{ matrix.framework }})
    needs: candidate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_USER: meridian_test
          POSTGRES_PASSWORD: meridian_test_only
          POSTGRES_DB: meridian_projection_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U meridian_test -d meridian_projection_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: |
            8.0.421
            9.0.318
            10.0.300
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed
      - name: Execute required PostgreSQL contracts
        shell: pwsh
        env:
          MERIDIAN_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=meridian_projection_test;Username=meridian_test;Password=meridian_test_only
        run: ./eng/verify-candidate.ps1 -Mode Run -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -Lane 'provider-postgres/${{ matrix.framework }}' -Context github-actions -RunId '${{ github.run_id }}'
      - name: Retain immutable attempt evidence
        id: snapshot-36
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-lane-provider-postgres-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          retention-days: 14
      - name: Upload lane evidence
        if: always() && steps.snapshot-36.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lane-provider-postgres-${{ matrix.framework }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          overwrite: true
          retention-days: 14
      - name: Retain immutable attempt evidence
        id: snapshot-38
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-projection-postgresql-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/evidence/work/**/*.log
            artifacts/evidence/work/**/*.trx
          retention-days: 14

      - name: Retain SQL, provider versions and command evidence
        if: always() && steps.snapshot-38.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: projection-postgresql-${{ matrix.framework }}
          path: |
            artifacts/evidence/work/**/*.log
            artifacts/evidence/work/**/*.trx
          overwrite: true
          retention-days: 14

  caching-redis:
    name: Distributed cache Redis (${{ matrix.framework }})
    needs: candidate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: |
            8.0.421
            9.0.318
            10.0.300
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed
      - name: Execute required isolated Redis cache contracts and owned Redis leases
        shell: pwsh
        env:
          MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports['6379'] }},abortConnect=true,connectTimeout=5000
        run: ./eng/verify-candidate.ps1 -Mode Run -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -Lane 'provider-redis-cache/${{ matrix.framework }}' -Context github-actions -RunId '${{ github.run_id }}'
      - name: Retain immutable attempt evidence
        id: snapshot-44
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-lane-provider-redis-cache-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          retention-days: 14
      - name: Upload lane evidence
        if: always() && steps.snapshot-44.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: lane-provider-redis-cache-${{ matrix.framework }}
          # Two paths force the artifact root to artifacts/evidence, so the lanes/<lane>/ prefix survives the merge.
          path: |
            artifacts/evidence/lanes/**
            artifacts/evidence/run-context.json
          overwrite: true
          retention-days: 14
      - name: Retain immutable attempt evidence
        id: snapshot-46
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-caching-redis-${{ matrix.framework }}-attempt-${{ github.run_attempt }}
          path: |
            artifacts/evidence/work/**/*.log
            artifacts/evidence/work/**/*.trx
          retention-days: 14

      - name: Retain executed provider and binary evidence
        if: always() && steps.snapshot-46.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: caching-redis-${{ matrix.framework }}
          path: |
            artifacts/evidence/work/**/*.log
            artifacts/evidence/work/**/*.trx
          overwrite: true
          retention-days: 14

  ef-transactions:
    name: EF transactions (${{ matrix.framework }})
    needs: candidate-pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [net8.0, net9.0, net10.0]
    services:
      postgres:
        image: postgres:16.4-alpine@sha256:5660c2cbfea50c7a9127d17dc4e48543eedd3d7a41a595a2dfa572471e37e64c
        env:
          POSTGRES_PASSWORD: meridian_test_only
          POSTGRES_DB: meridian_ef_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U postgres -d meridian_ef_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports: ['6379/tcp']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        env:
          # Install only the pinned SDKs into a private directory so no preinstalled SDK or runtime patch can be selected.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          skip-lts-prepass: true
          dotnet-version: |
            8.0.421
            9.0.318
            10.0.300
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate-pack.outputs.feedArtifact }}
          path: artifacts/candidate-feed
      - name: Execute required EF8 transactions and real provider contracts
        shell: pwsh
        env:
          MERIDIAN_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=meridian_ef_test;Username=postgres;Password=meridian_test_only
          MERIDIAN_TEST_REDIS: 127.0.0.1:${{ job.services.redis.ports['6379'] }}
        run: ./eng/verify-candidate.ps1 -Mode Run -Feed artifacts/candidate-feed -EvidenceDirectory artifacts/evidence -CandidateVersion '${{ needs.candidate-pack.outputs.candidate }}' -Lane 'ef-transactions/${{ matrix.framework }}' -Context github-actions -RunId '${{ github.run_id }}'
      - name: Retain immutable attempt evidence
        id: snapshot-52
        if: always()
        uses: actions/upload-artifact@v4
