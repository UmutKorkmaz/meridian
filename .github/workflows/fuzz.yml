name: Fuzz

# Security review: only scheduled/workflow_dispatch triggers and static
# env vars used. No github.event.* fields are interpolated into run: blocks.
# SharpFuzz + AFL requires an OS-level AFL install and is not reliable on
# GitHub-hosted runners. Until a dedicated runner with AFL is provisioned,
# this workflow runs the FsCheck property-based tests at elevated
# iteration counts (10 000 scalar/depth cases, 500 collection cases). That covers the same
# invariants — no StackOverflow, no OOM, no undocumented exceptions — at
# lower fidelity but on every scheduled run. See
# tests/Meridian.Mapping.Fuzz/README.md for the local coverage-guided
# fuzz workflow.
#
# Schedule repair (no new monitors): the existing nightly schedule now pins the exact SDK used by the required CI
# lanes (global.json only names a minimum), disables preview roll-forward, fails when the executed case counts differ
# from the configured budgets (a green run that executed fewer cases is not a pass), and retains immutable attempt
# snapshots before refreshing the current artifact view. The same budgets are required per candidate by the
# `property counts (net10.0)` lane in ci.yml. The recorded workflow_dispatch trigger stays for manual runs.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC

permissions:
  contents: read

jobs:
  property-tests-high-count:
    name: FsCheck properties (10k scalar/depth, 500 collections)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOTNET_ROLL_FORWARD: LatestPatch
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet-fuzz
        with:
          dotnet-version: 10.0.300

      - name: Require the actual selected SDK
        shell: bash
        run: test "$(dotnet --version)" = "10.0.300"

      - name: Build tests
        run: dotnet build tests/Meridian.Mapping.Tests -c Release -f net10.0

      - name: Choose replay seed
        shell: bash
        run: |
          seed="$(od -An -N8 -tu8 /dev/urandom | tr -d '[:space:]')"
          echo "MERIDIAN_FSCHECK_REPLAY=$seed,11400714819323198485" >> "$GITHUB_ENV"

      - name: Run FsCheck property tests with elevated iteration count
        env:
          MERIDIAN_FSCHECK_MAX_TEST: "10000"
          MERIDIAN_FSCHECK_COLLECTION_MAX_TEST: "500"
          # Hexadecimal bytes: a 1 GiB managed heap budget, not an RSS cap.
          DOTNET_GCHeapHardLimit: "40000000"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fuzz-results
          dotnet --info > fuzz-results/dotnet-info.log
          printf 'Configured budgets: scalar/depth=%s collections=%s replay=%s managed_heap_bytes=1073741824\n' \
            "$MERIDIAN_FSCHECK_MAX_TEST" "$MERIDIAN_FSCHECK_COLLECTION_MAX_TEST" \
            "$MERIDIAN_FSCHECK_REPLAY" | tee fuzz-results/property-output.log
          dotnet test tests/Meridian.Mapping.Tests -c Release -f net10.0 --no-build \
            --filter "FullyQualifiedName~PropertyBasedTests" \
            --logger "console;verbosity=detailed" \
            --logger "trx;LogFileName=fuzz-properties.trx" \
            --results-directory ./fuzz-results 2>&1 | tee -a fuzz-results/property-output.log

      - name: Require the configured case counts
        shell: bash
        run: |
          set -euo pipefail
          log=fuzz-results/property-output.log
          test "$(grep -c 'Ok, passed 10000 tests' "$log")" = 3
          test "$(grep -c 'Ok, passed 500 tests' "$log")" = 2

      - name: Retain immutable attempt evidence
        id: snapshot-8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-fuzz-property-results-attempt-${{ github.run_attempt }}
          path: ./fuzz-results/
          retention-days: 30

  # Uncomment once a runner with AFL is provisioned:
  #
  # sharp-fuzz-afl:
  #   name: SharpFuzz + AFL (1 hour)
  #   runs-on: self-hosted-with-afl
  #   timeout-minutes: 90
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-dotnet@v5
  #       with:
  #         global-json-file: global.json
  #     - run: dotnet tool install --global SharpFuzz.CommandLine
  #     - run: dotnet build tests/Meridian.Mapping.Fuzz -c Release
  #     - run: sharpfuzz tests/Meridian.Mapping.Fuzz/bin/Release/net10.0/Meridian.Mapping.dll
  #     - run: |
  #         afl-fuzz -V 3600 \
  #           -i tests/Meridian.Mapping.Fuzz/corpus \
  #           -o findings -- \
  #           tests/Meridian.Mapping.Fuzz/bin/Release/net10.0/Meridian.Mapping.Fuzz @@
  #     - uses: actions/upload-artifact@v4
  #       if: always()
  #       with:
  #         name: fuzz-findings
  #         path: findings/
  #         retention-days: 90
      - name: Upload results
        if: always() && steps.snapshot-8.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-property-results
          path: ./fuzz-results/
          overwrite: true
          retention-days: 30

  # Uncomment once a runner with AFL is provisioned:
  #
  # sharp-fuzz-afl:
  #   name: SharpFuzz + AFL (1 hour)
  #   runs-on: self-hosted-with-afl
  #   timeout-minutes: 90
  #   steps:
  #     - uses: actions/checkout@v6
  #     - uses: actions/setup-dotnet@v5
  #       with:
  #         global-json-file: global.json
  #     - run: dotnet tool install --global SharpFuzz.CommandLine
  #     - run: dotnet build tests/Meridian.Mapping.Fuzz -c Release
  #     - run: sharpfuzz tests/Meridian.Mapping.Fuzz/bin/Release/net10.0/Meridian.Mapping.dll
  #     - run: |
  #         afl-fuzz -V 3600 \
  #           -i tests/Meridian.Mapping.Fuzz/corpus \
  #           -o findings -- \
  #           tests/Meridian.Mapping.Fuzz/bin/Release/net10.0/Meridian.Mapping.Fuzz @@
  #     - uses: actions/upload-artifact@v4
