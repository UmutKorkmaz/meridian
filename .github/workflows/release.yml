name: Release promotion plan

# Security review (E5 exact-candidate promotion):
# - The former workflow fired on a v* tag push, rebuilt and re-packed from the tag, attested that rebuild, generated new
#   SBOMs, created a public GitHub release and pushed NuGet packages with --skip-duplicate. Those were not the bytes the
#   candidate gate verified, so that publisher is REMOVED. There is no push/tag trigger: a tag event can never start a
#   builder or an uploader again.
# - workflow_dispatch only. Token permissions: contents read; actions read only to download the supplied bundle artifact.
# - This workflow never builds, packs, attests, signs, tags, creates releases or publishes packages. It downloads a
#   prepared candidate bundle (eng/prepare-release.ps1), verifies it against the approved SHA-256 of the exact
#   candidate.json bytes and writes a READ-ONLY promotion plan (eng/promote-release.ps1) computed from GET requests.
# - Executing a promotion requires trusted authorization bound to the candidate digest, repository, version, targets and
#   source commit. No trusted authorization verifier exists in this repository, so execution is not available here and
#   fails closed. A self-authored approval document or possession of the digest is not authority.
# - Inputs reach the shell only through env:, never by interpolation into run: blocks.

on:
  workflow_dispatch:
    inputs:
      bundle_run_id:
        description: Run id of the workflow run whose artifact holds the prepared candidate bundle
        required: true
        type: string
      bundle_artifact:
        description: Artifact name of the prepared candidate bundle
        required: true
        type: string
      candidate_path:
        description: Relative path of candidate.json inside the artifact
        required: true
        default: candidate.json
        type: string
      approved_manifest_sha256:
        description: SHA-256 of the exact candidate.json bytes that were presented for authorization
        required: true
        type: string
      release_preparation:
        description: Stable candidate intent (required for a stable version; never authorization)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-plan-${{ inputs.approved_manifest_sha256 }}
  cancel-in-progress: false

jobs:
  promotion-plan:
    name: Verify the supplied bundle and write a read-only promotion plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read   # read-only: download the supplied bundle artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download the prepared candidate bundle
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.bundle_artifact }}
          run-id: ${{ inputs.bundle_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate

      - name: Verify the bundle and plan the promotion (read-only)
        shell: pwsh
        env:
          APPROVED_SHA256: ${{ inputs.approved_manifest_sha256 }}
          CANDIDATE_PATH: ${{ inputs.candidate_path }}
          RELEASE_PREPARATION: ${{ inputs.release_preparation }}
          BUNDLE_ROOT: ${{ runner.temp }}/candidate
          PLAN_PATH: ${{ runner.temp }}/promotion-plan/promotion-plan.json
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CANDIDATE_PATH -cnotmatch '\A[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*\z' -or $env:CANDIDATE_PATH -match '(^|/)\.\.?(/|$)') {
            Write-Host '::error::candidate_path must be a relative path inside the downloaded artifact'
            exit 2
          }
          New-Item -ItemType Directory -Force (Split-Path -Parent $env:PLAN_PATH) | Out-Null
          $arguments = @{
            Manifest = (Join-Path $env:BUNDLE_ROOT $env:CANDIDATE_PATH)
            ApprovedManifestSha256 = $env:APPROVED_SHA256
            Output = $env:PLAN_PATH
          }
          if ($env:RELEASE_PREPARATION -eq 'true') { $arguments.ReleasePreparation = $true }
          & ./eng/promote-release.ps1 @arguments
          $code = $LASTEXITCODE
          Write-Host "Promotion plan exit code $code (0 plan ready, 1 integrity failure or stop condition, 2 invalid input, 3 blocked)."
          Write-Host 'Execution is not available: it requires trusted authorization bound to the candidate digest, repository, version, targets and source commit, and no trusted verifier exists in this repository.'
          exit $code

      - name: Upload the promotion plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promotion-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/promotion-plan
          if-no-files-found: warn
          overwrite: true
          retention-days: 30
