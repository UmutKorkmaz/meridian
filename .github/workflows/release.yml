name: Release

# Security review:
# - Trigger restricted to tag pattern vX.Y.Z / vX.Y.Z-*, so only a maintainer
#   pushing a matching tag can fire the workflow.
# - github.ref_name is used only after stripping the trusted `v` prefix to
#   match package versions declared in repository csproj files.
# - NUGET_API_KEY is consumed via env:, never via ${{ secrets.* }} in run:.
# - No attacker-controllable github.event.* fields flow anywhere.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build + sign + publish
    runs-on: ubuntu-latest
    permissions:
      contents: write      # GitHub Release + asset upload
      id-token: write      # Sigstore OIDC
      attestations: write  # Provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Ignore preview SDK pin for release
        run: mv global.json global.json.release-ignored

      - name: Select packages for this tag from inventory
        id: versions
        shell: pwsh
        run: |
          Import-Module ./eng/package-inventory.psm1 -Force -DisableNameChecking
          $inventory = Read-PackageInventory (Get-Location).Path 'eng/packages.json'
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          $selected = @(Select-ReleasePackages $inventory (Get-Location).Path (Get-Command dotnet).Source $tagVersion)
          New-Item -ItemType Directory -Force ./artifacts | Out-Null
          ConvertTo-Json -InputObject $selected -Depth 10 | Set-Content ./artifacts/selected-packages.json
          "tag_version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Restore selected inventory and test projects
        shell: pwsh
        run: |
          $selected = @(Get-Content -Raw ./artifacts/selected-packages.json | ConvertFrom-Json)
          foreach ($project in @($selected.project) + @('tests/Meridian.Mapping.Tests/Meridian.Mapping.Tests.csproj', 'tests/Meridian.Mediator.Tests/Meridian.Mediator.Tests.csproj')) {
            dotnet restore $project
            if ($LASTEXITCODE -ne 0) { throw "Restore failed: $project" }
          }

      - name: Build selected inventory (Release, deterministic)
        shell: pwsh
        run: |
          $selected = @(Get-Content -Raw ./artifacts/selected-packages.json | ConvertFrom-Json)
          foreach ($package in $selected) {
            dotnet build $package.project -c Release --no-restore -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Build failed: $($package.id)" }
          }

      - name: Test (final gate)
        run: |
          dotnet test tests/Meridian.Mapping.Tests/Meridian.Mapping.Tests.csproj \
            -c Release -f net10.0 --no-restore --nologo
          dotnet test tests/Meridian.Mediator.Tests/Meridian.Mediator.Tests.csproj \
            -c Release -f net10.0 --no-restore --nologo

      - name: Pack selected inventory packages
        shell: pwsh
        run: |
          $selected = @(Get-Content -Raw ./artifacts/selected-packages.json | ConvertFrom-Json)
          foreach ($package in $selected) {
            dotnet pack $package.project -c Release --no-build -o ./artifacts -p:ContinuousIntegrationBuild=true
            if ($LASTEXITCODE -ne 0) { throw "Pack failed: $($package.id)" }
          }

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOMs for selected inventory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force ./sbom | Out-Null
          $selected = @(Get-Content -Raw ./artifacts/selected-packages.json | ConvertFrom-Json)
          foreach ($package in $selected) {
            dotnet CycloneDX $package.project -o ./sbom -fn "$($package.id).sbom.json" -F Json
            if ($LASTEXITCODE -ne 0) { throw "SBOM failed: $($package.id)" }
          }

      - name: Upload packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./sbom/*.sbom.json
          retention-days: 90

      - name: Create GitHub Release with packages + SBOMs
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
            ./sbom/*.sbom.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::error::NUGET_API_KEY secret is not set. Configure via: gh secret set NUGET_API_KEY"
            exit 1
          fi
          dotnet nuget push "./artifacts/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
